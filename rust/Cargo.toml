[package]
name = "cdk-ffi-go"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
version = "0.18.0"
readme = "README.md"

[lib]
crate-type = ["cdylib"]
name = "cdk_ffi_go"

[dependencies]
cdk-ffi = { git = "https://github.com/cashubtc/cdk", rev = "a9fa8c9a634f11d8b624f6c36a80eb15e7ce860e", features = ["npubcash", "nwc", "bip353"] }

[lints]


[profile.release]
lto = true
strip = true
codegen-units = 1
