[package]
name = "cdk-ffi-go"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
homepage = "https://github.com/cashubtc/cdk"
repository = "https://github.com/cashubtc/cdk.git"
version = "0.18.0"
readme = "README.md"

[lib]
crate-type = ["cdylib"]
name = "cdk_ffi_go"

[dependencies]
cdk-ffi = { git = "https://github.com/cashubtc/cdk", rev = "70ed1f982aced32c5766bcdcb8693af88a07d321", features = ["npubcash", "nwc", "bip353"] }

[lints]


[profile.release]
lto = true
strip = true
codegen-units = 1
